name: SDK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Test packages in dependency order
        run: npm test

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift
            os: macos-latest
            directory: native/swift
            tool: swift
          - name: Kotlin
            os: ubuntu-latest
            directory: native/kotlin
            tool: kotlin
          - name: Flutter
            os: ubuntu-latest
            directory: native/flutter
            tool: flutter
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        if: matrix.tool == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Dart
        if: matrix.tool == 'flutter'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Test Swift
        if: matrix.tool == 'swift'
        run: swift test
      - name: Test Kotlin
        if: matrix.tool == 'kotlin'
        run: ./gradlew test --no-daemon
      - name: Analyze and test Flutter
        if: matrix.tool == 'flutter'
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
