name: loomup
description: >
  Dart client for Loomup Realtime — auth, REST CRUD, and WebSocket subscriptions.
  Works with Flutter and pure Dart (no Flutter framework dependency).
version: 0.1.0
homepage: https://tryloomup.com

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
